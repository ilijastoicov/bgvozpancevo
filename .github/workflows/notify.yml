name: BG voz obaveštenja

on:
  schedule:
    - cron: "*/10 * * * *"   # na svakih 10 minuta (GitHub zna da kasni par minuta)
  workflow_dispatch:          # ručno pokretanje: Actions -> Run workflow

permissions:
  contents: write             # da bi mogao da sačuva seen.json

concurrency:
  group: bg-voz-notify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Skripta koristi samo standardnu Python biblioteku, a python3 već
      # postoji na GitHub runneru, pa setup-python nije potreban.
      - name: Proveri obaveštenja
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS_REGEX: ${{ vars.KEYWORDS_REGEX }}
        run: python3 bg_voz_notify.py

      - name: Sačuvaj stanje
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Ažurirano stanje poslatih obaveštenja"
            git pull --rebase
            git push
          fi
